<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />

    <!-- Set the theme before anything paints, so a reload never flashes the
         wrong one. A saved choice wins; otherwise the device's setting. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("kindred-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", t);
        root.setAttribute("data-bs-theme", t);
      })();
    </script>
    <title>Just Rent a Friend — book real time with real people</title>
    <meta
      name="description"
      content="Pay for someone's time by the hour: a coffee, a gig, a walk across the city. Verified members, 18+, no sexual services."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
